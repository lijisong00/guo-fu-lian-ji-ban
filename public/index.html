<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14100c">
<title>热血传奇 · 国服联机版</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #171008; color: #e8dcc0;
    font-family: "Songti SC", "STSong", "SimSun", serif; min-height: 100vh; }
  body { display: flex; flex-direction: column; align-items: center; padding: 32px 20px 48px; }
  .logo { color: #d4a437; font-size: 34px; font-weight: 900; letter-spacing: 4px; margin: 18px 0 4px; text-align: center; }
  .sub { color: #a08d64; font-size: 15px; margin-bottom: 26px; text-align: center; }
  .card { width: 100%; max-width: 420px; background: #241a0e; border: 1px solid #4a3517;
    border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 17px; color: #d4a437; }
  .card p { margin: 6px 0; font-size: 14px; line-height: 1.7; color: #c9b98f; }
  .char { display: flex; justify-content: space-between; padding: 8px 2px;
    border-bottom: 1px solid #3a2a12; font-size: 15px; }
  .char:last-child { border-bottom: none; }
  .char .empty { color: #8a7a58; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  input[type="text"] { flex: 1; min-width: 0; background: #171008; color: #e8dcc0;
    border: 1px solid #4a3517; border-radius: 10px; padding: 11px 12px; font-size: 16px;
    letter-spacing: 2px; outline: none; }
  input[type="text"]:focus { border-color: #d4a437; }
  button { border: none; border-radius: 10px; padding: 12px 18px; font-size: 16px;
    font-weight: 700; cursor: pointer; background: #d4a437; color: #241a0e; }
  button.secondary { background: #2e1e0c; color: #d4a437; border: 1px solid #4a3517; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.big { width: 100%; max-width: 420px; padding: 15px; font-size: 18px; }
  .msg { font-size: 14px; margin-top: 10px; min-height: 20px; }
  .msg.err { color: #e07856; }
  .msg.ok { color: #9ec97a; }
  .foot { margin-top: 18px; font-size: 12px; color: #8a7a58; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
  <div class="logo">热血传奇</div>
  <div class="sub">国服服务器版 · 独立联机版</div>

  <div class="card">
    <h2>我的角色</h2>
    <div id="charList"><p>正在读取…</p></div>
  </div>

  <div class="card" id="claimCard">
    <h2>认领角色</h2>
    <p>第一次进游戏：输入一次性认领码，把之前服务器版的三个角色领到这台设备上。认领过一次后码就失效了，不用再填。</p>
    <div class="row">
      <input type="text" id="claimCode" placeholder="6 位认领码" maxlength="6" inputmode="numeric" autocomplete="off">
      <button id="claimBtn">认领</button>
    </div>
    <div class="msg" id="claimMsg"></div>
  </div>

  <button class="big" id="enterBtn">进入游戏</button>

  <div class="foot">
    免费服务器 15 分钟没人玩会休眠，第一次打开需要 30–60 秒唤醒，请不要关闭页面。<br>
    建房后把 5 位房间码发给朋友，就能一起打。
  </div>

<script>
(function () {
  'use strict';
  // 身份对齐：与游戏客户端用同一个玩家标识（localStorage 键与生成规则
  // 与服务器版客户端一致），同时写 cookie 供服务端认存档。
  var PID_KEY = 'rxcq_server_player_id';
  var DEVICE_RE = /^[A-Za-z0-9][A-Za-z0-9_-]{7,63}$/;
  function genPid() { return 'p' + Math.random().toString(36).slice(2, 10); }
  var pid = null;
  try { pid = localStorage.getItem(PID_KEY); } catch (e) { pid = null; }
  if (!pid || !DEVICE_RE.test(pid)) {
    pid = genPid();
    try { localStorage.setItem(PID_KEY, pid); } catch (e) { /* ignore */ }
  }
  document.cookie = 'lg_device_id=' + encodeURIComponent(pid) +
    '; path=/; max-age=31536000; SameSite=Lax';

  var $ = function (id) { return document.getElementById(id); };
  function setMsg(t, cls) {
    var m = $('claimMsg');
    m.textContent = t || '';
    m.className = 'msg' + (cls ? ' ' + cls : '');
  }

  function renderChars(chars) {
    var box = $('charList');
    var html = '';
    for (var i = 0; i < 5; i++) {
      var c = chars && chars[i];
      if (c) {
        var cls = { war: '战士', mage: '法师', tao: '道士', warrior: '战士', taoist: '道士' }[c.cls] || c.cls;
        html += '<div class="char"><span>' + (i + 1) + ' 号位 · ' + c.name + '（' + cls + '）</span>' +
          '<span>' + c.level + ' 级 · ' + c.gold + ' 金币</span></div>';
      } else {
        html += '<div class="char"><span class="empty">' + (i + 1) + ' 号位 · 空</span><span class="empty">进游戏新建</span></div>';
      }
    }
    box.innerHTML = html;
  }

  function refreshChars() {
    fetch('/api/characters?deviceId=' + encodeURIComponent(pid))
      .then(function (r) { return r.json(); })
      .then(function (j) { renderChars(j.characters || []); })
      .catch(function () { $('charList').innerHTML = '<p>读取失败，点进入游戏后重试。</p>'; });
  }

  function refreshHealth() {
    fetch('/api/health')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.claimUsed) {
          $('claimCard').style.display = 'none';
        }
      })
      .catch(function () { /* ignore */ });
  }

  $('claimBtn').addEventListener('click', function () {
    var code = $('claimCode').value.trim();
    if (!code) { setMsg('先输入认领码', 'err'); return; }
    $('claimBtn').disabled = true;
    setMsg('认领中…');
    fetch('/api/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code, deviceId: pid }),
    })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (x) {
        if (x.body && x.body.ok) {
          setMsg('认领成功，三个角色已到账', 'ok');
          $('claimCard').style.display = 'none';
          refreshChars();
        } else {
          setMsg((x.body && x.body.error) || '认领失败', 'err');
        }
      })
      .catch(function () { setMsg('网络不对，再试一次', 'err'); })
      .finally(function () { $('claimBtn').disabled = false; });
  });

  $('enterBtn').addEventListener('click', function () {
    window.location.href = '/game/';
  });

  refreshChars();
  refreshHealth();
})();
</script>
</body>
</html>
